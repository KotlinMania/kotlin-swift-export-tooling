name: Verify immutable Maven release
on:
  release:
    types: [released]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.8.2'
      - name: Retrieve independently published files
        run: tools/producer verify-published --output build/central-retrieval
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: central-retrieval
          path: build/central-retrieval/
