name: Verify immutable Maven release
on:
  release:
    types: [released]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Retrieve independently published files
        run: python3 scripts/verify_published.py --output build/central-retrieval
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: central-retrieval
          path: build/central-retrieval/
